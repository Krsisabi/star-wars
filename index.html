<!doctype html>

      rel="preconnect"

      crossorigin
    />
    <script>
      (function () {
        var theme;
        try {
          theme = JSON.parse(localStorage.getItem('theme'));
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
